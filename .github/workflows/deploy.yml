name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = only list the changes. deploy = really update the server."
        type: choice
        options:
          - dry-run
          - deploy
        default: dry-run

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build and (optionally) deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP 8.3 (same major version as production)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, xml, ctype, fileinfo, tokenizer, curl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install PHP dependencies (with dev tools, for tests)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare test environment file (CI only, never deployed)
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          COLUMNS: 250
        run: vendor/bin/pest

      - name: Install production-only PHP packages
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Remove CI-only files from the release
        run: rm -f .env

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync files to the server
        env:
          MODE: ${{ inputs.mode }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          REMOTE_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          echo "Mode: $MODE"
          echo "Commit: $GITHUB_SHA"
          DRY=""
          if [ "$MODE" != "deploy" ]; then
            DRY="--dry-run"
            echo "DRY RUN: nothing will be changed on the server."
          fi
          echo

          rsync -rlpzci $DRY --delete-after --delay-updates \
            --chmod=D755,F644 \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.vscode/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/create_db.php' \
            --exclude='/DEPLOYED_COMMIT' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            --exclude='/public/uploads/' \
            --exclude='/public/hot' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/.backup/' \
            --exclude='/bootstrap/cache/*.php' \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22" \
            ./ "$USER_NAME@$HOST:$REMOTE_PATH/" | tee /tmp/rsync.txt

          echo
          echo "========== SUMMARY ($MODE) =========="
          SENT=$(grep -c '^<f' /tmp/rsync.txt || true)
          NEW=$(grep -c '^<f+++++++++' /tmp/rsync.txt || true)
          DELETED=$(grep -c '^\*deleting' /tmp/rsync.txt || true)
          echo "Files sent (new or changed): $SENT (new: $NEW)"
          echo "Files or folders deleted on the server: $DELETED"
          echo
          echo "---- Changes outside vendor/ and public/build/assets/ ----"
          grep -E '^(<f|\*deleting|cd|cL)' /tmp/rsync.txt | grep -v -e ' vendor/' -e ' public/build/assets/' || echo "(none)"
          echo
          echo "---- Frontend build lines: $(grep -c ' public/build/assets/' /tmp/rsync.txt || true) ----"
          echo
          echo "---- vendor/ lines (first 60) ----"
          grep ' vendor/' /tmp/rsync.txt | head -60 || echo "(none)"
          echo "========== END SUMMARY =========="

      - name: Refresh Laravel on the server
        if: inputs.mode == 'deploy'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          REMOTE_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 22 "$USER_NAME@$HOST" "REMOTE_PATH='$REMOTE_PATH' COMMIT='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_PATH"
          PHP_BIN=$(command -v php || echo /usr/local/bin/php)
          "$PHP_BIN" -v | head -1
          rm -f bootstrap/cache/*.php
          "$PHP_BIN" artisan package:discover --ansi
          "$PHP_BIN" artisan view:clear
          echo "$COMMIT" > DEPLOYED_COMMIT
          echo "Server refreshed."
          REMOTE

      - name: Check the live site
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --max-time 30 -o /dev/null -w "Health check /up: HTTP %{http_code}\n" https://pharmaye.kaldisbunnaet.com/up
          curl --fail --silent --show-error --location --max-time 30 -o /dev/null -w "Home page: HTTP %{http_code}\n" https://pharmaye.kaldisbunnaet.com/