<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .cup-green { fill: #137438; }
      .leaf-green { fill: #78B833; }
      .cross-white { fill: #FFFFFF; }
      .line-dark { stroke: #0B4E25; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .line-leaf { stroke: #4F821A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g transform="translate(10, 20)">
    <!-- 1. Mortar Bowl with pedestal & inner depth -->
    <path d="M 205 352 L 295 352 L 295 375 L 205 375 Z" class="cup-green" />
    <path d="M 205 352 L 295 352 L 295 375 L 205 375 Z" fill="none" class="line-dark" />

    <path d="M 172 260 
             C 175 330, 205 352, 250 352 
             C 295 352, 325 330, 328 260 Z" 
          class="cup-green" />
    <path d="M 172 260 
             C 175 330, 205 352, 250 352 
             C 295 352, 325 330, 328 260 Z" 
          fill="none" class="line-dark" />

    <!-- Oval Mortar Rim -->
    <ellipse cx="250" cy="260" rx="78" ry="24" class="cup-green" />
    <ellipse cx="250" cy="260" rx="78" ry="24" fill="none" class="line-dark" />
    
    <!-- Inner bowl cavity -->
    <ellipse cx="250" cy="260" rx="63" ry="16" fill="#0E582A" />
    <ellipse cx="250" cy="260" rx="63" ry="16" fill="none" class="line-dark" />

    <!-- Centered Medical Cross on Mortar -->
    <path d="M 242 284 H 258 V 298 H 272 V 314 H 258 V 328 H 242 V 314 H 228 V 298 H 242 Z" 
          class="cross-white" />

    <!-- 2. Leaves inside Mortar -->
    <!-- Left Leaf -->
    <path d="M 248 262 
             C 252 245, 260 230, 268 220 
             C 275 235, 272 252, 266 262 Z" 
          class="leaf-green" />
    <path d="M 248 262 C 252 245, 260 230, 268 220 C 275 235, 272 252, 266 262 Z" fill="none" class="line-leaf" />
    <line x1="254" y1="258" x2="268" y2="220" class="line-leaf" />

    <!-- Right Leaf -->
    <path d="M 264 262 
             C 278 248, 298 234, 320 232 
             C 310 248, 292 258, 280 263 Z" 
          class="leaf-green" />
    <path d="M 264 262 C 278 248, 298 234, 320 232 C 310 248, 292 258, 280 263 Z" fill="none" class="line-leaf" />
    <line x1="268" y1="260" x2="320" y2="232" class="line-leaf" />

    <!-- 3. Pestle -->
    <!-- Pestle lower rod going into the mortar -->
    <path d="M 213 192 L 235 264 L 255 264 L 244 192 Z" fill="#188C44" />
    <path d="M 213 192 L 235 264 L 255 264 L 244 192 Z" fill="none" class="line-dark" />

    <!-- Flared top head above fist -->
    <path d="M 194 135 
             C 192 125, 222 118, 230 128 
             L 225 155 
             L 204 155 Z" 
          fill="#188C44" />
    <ellipse cx="212" cy="130" rx="19" ry="8" transform="rotate(-15 212 130)" fill="#188C44" />
    <ellipse cx="212" cy="130" rx="19" ry="8" transform="rotate(-15 212 130)" fill="none" class="line-dark" />

    <!-- 4. Shortened Forearm & Hand with Gentle Slope -->
    <!-- Trimmed forearm with a soft, gradual slope (~20° angle instead of steep) -->
    <path d="M 320 148 
             L 254 186 
             C 248 194, 242 202, 238 210 
             L 228 162 
             L 298 116 Z" 
          class="cup-green" />
    
    <!-- Arm outline with rounded wrist cut-off -->
    <path d="M 254 186 L 320 148 C 326 144, 330 138, 326 130 C 322 122, 308 112, 298 116 L 228 162" 
          fill="none" class="line-dark" />

    <!-- Palm Base -->
    <path d="M 206 142 
             C 220 134, 238 136, 248 152 
             C 256 166, 252 184, 242 200 
             C 230 210, 218 214, 204 214 
             C 195 214, 185 206, 184 195 Z" 
          class="cup-green" />

    <!-- Thumb gripping over the pestle -->
    <path d="M 235 150 
             C 230 140, 212 145, 202 165 
             C 198 174, 208 178, 214 172 
             C 222 162, 230 156, 235 150 Z" 
          fill="#1FB357" />
    <path d="M 235 150 C 230 140, 212 145, 202 165 C 198 174, 208 178, 214 172 C 222 162, 230 156, 235 150 Z" fill="none" class="line-dark" />

    <!-- 4 Horizontal Fingers Gripping Pestle -->
    <!-- Finger 1 -->
    <path d="M 200 155 C 178 152, 178 170, 196 174 L 234 174" class="cup-green" />
    <path d="M 200 155 C 178 152, 178 170, 196 174 L 234 174" fill="none" class="line-dark" />
    <path d="M 224 165 C 228 165, 230 172, 226 174" fill="none" class="line-dark" stroke-width="2" />

    <!-- Finger 2 -->
    <path d="M 196 174 C 176 172, 176 190, 196 194 L 238 194" class="cup-green" />
    <path d="M 196 174 C 176 172, 176 190, 196 194 L 238 194" fill="none" class="line-dark" />
    <path d="M 228 184 C 232 184, 234 192, 230 194" fill="none" class="line-dark" stroke-width="2" />

    <!-- Finger 3 -->
    <path d="M 196 194 C 178 192, 178 210, 198 214 L 240 214" class="cup-green" />
    <path d="M 196 194 C 178 192, 178 210, 198 214 L 240 214" fill="none" class="line-dark" />
    <path d="M 230 204 C 234 204, 236 212, 232 214" fill="none" class="line-dark" stroke-width="2" />

    <!-- Finger 4 -->
    <path d="M 198 214 C 182 214, 184 232, 202 234 L 238 234" class="cup-green" />
    <path d="M 198 214 C 182 214, 184 232, 202 234 L 238 234" fill="none" class="line-dark" />
    <path d="M 228 224 C 232 224, 234 232, 230 234" fill="none" class="line-dark" stroke-width="2" />

    <!-- Knuckle crease marks -->
    <path d="M 200 174 L 206 174" class="line-dark" />
    <path d="M 200 194 L 206 194" class="line-dark" />
    <path d="M 202 214 L 208 214" class="line-dark" />
  </g>
</svg>
